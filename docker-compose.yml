services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_password
      POSTGRES_DB: crm_atlantic
    ports:
      - "5432:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_atlantic"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crm:crm_dev_password@db:5432/crm_atlantic?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  crm_data:
